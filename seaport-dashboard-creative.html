<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){var t;try{t=localStorage.getItem("seaport-theme")}catch(e){}if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t)})()</script>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notice board | Seaport</title>
<meta name="description" content="Seaport creative dashboard (preview).">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&family=Fraunces:ital,wght@1,600&family=Barlow+Condensed:wght@800&family=Pirata+One&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@1.48.0/dist/umd/lucide.min.js"></script>
<link rel="icon" type="image/png" href="assets/seaport/logo.png">
<link rel="stylesheet" href="assets/seaport/seaport.css">
<link rel="stylesheet" href="assets/seaport/dashboard.css">
</head>
<body class="nbbody" data-role="creative">
<header class="dtop nbtop">
  <a class="logo" href="#board" aria-label="Seaport, notice board home"><img src="assets/seaport/logo.png" alt="">Seaport</a>
  <nav class="nbcrumb" aria-label="You are here"><a href="#board">Notice board</a><span id="crumb"></span></nav>
  <label class="dsearch"><i data-lucide="search"></i><input type="search" id="dq" placeholder="Search the notices" aria-label="Search the notices"></label>
  <div class="themebox" role="group" aria-label="Colour theme"><button type="button" data-set-theme="light" aria-label="Light version" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button type="button" data-set-theme="dark" aria-label="Dark mode" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div>
  <button class="dicon" id="bell" aria-label="Notifications" aria-expanded="false"><i data-lucide="bell"></i><span class="dot"></span></button>
  <div class="dme"><span class="av" id="meAv"></span><span><b id="meName"></b><small id="meOrg"></small></span></div>
  <a class="nblogout" href="seaport-login.html" id="logout"><i data-lucide="log-out"></i><span>Log out</span></a>
</header>
<p class="nbpreview"><i data-lucide="info"></i>Preview with sample data. Every notice opens; changes stay only in this browser.</p>
<main class="nbmain" id="dash" tabindex="-1"></main>
<script src="assets/seaport/seaport.js"></script>
<script src="assets/seaport/dashboard.js"></script>
</body>
</html>
