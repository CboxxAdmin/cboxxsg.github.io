<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){var t;try{t=localStorage.getItem("seaport-theme")}catch(e){}if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t)})()</script>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company dashboard | Seaport</title>
<meta name="description" content="Seaport company dashboard (preview).">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/seaport/favicon-32.png?v=3">
<link rel="apple-touch-icon" href="/assets/seaport/apple-touch-icon.png?v=3">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0B0B0D">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&family=Fraunces:ital,wght@1,600&family=Barlow+Condensed:wght@800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@1.48.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="assets/seaport/seaport.css">
<link rel="stylesheet" href="assets/seaport/dashboard.css">
</head>
<body class="dashbody" data-role="company">
<div class="dash">
  <aside class="dside">
    <a class="logo" href="#overview" aria-label="Seaport, dashboard home"><svg class="sp-mark" viewBox="0 0 332 222" width="39" height="26" aria-hidden="true" focusable="false" style="flex:none;display:block"><g transform="translate(8,8) translate(-40,-20)"><g fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round"><path d="M300,20 C196,22 106,30 104,58 C102,88 224,114 224,150 C224,186 124,200 40,214"/><path transform="translate(56,12)" d="M300,20 C196,22 106,30 104,58 C102,88 224,114 224,150 C224,186 124,200 40,214"/></g><circle cx="224" cy="150" r="17" fill="currentColor"/><circle cx="280" cy="162" r="17" fill="#D2231C"/></g></svg>Seaport</a>
    <span class="dtag">Company</span>
    <nav aria-label="Dashboard"><a href="#overview" data-view="overview"><i data-lucide="layout-dashboard"></i>Overview</a><a href="#briefs" data-view="briefs"><i data-lucide="file-text"></i>Briefs</a><a href="#creatives" data-view="creatives"><i data-lucide="users"></i>Creatives</a><a href="#licences" data-view="licences"><i data-lucide="scroll-text"></i>Licences</a><a href="#invoices" data-view="invoices"><i data-lucide="receipt"></i>Invoices</a><a href="#brand" data-view="brand"><i data-lucide="book-open"></i>Brand hub</a><a href="#settings" data-view="settings"><i data-lucide="settings"></i>Settings</a></nav>
    <a class="dlogout" href="seaport-login.html" id="logout"><i data-lucide="log-out"></i>Log out</a>
  </aside>
  <div class="dmain">
    <header class="dtop">
      <label class="dsearch"><i data-lucide="search"></i><input type="search" id="dq" placeholder="Search briefs, creatives, licences" aria-label="Search"></label>
      <div class="themebox" role="group" aria-label="Colour theme"><button type="button" data-set-theme="light" aria-label="Light version" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button type="button" data-set-theme="dark" aria-label="Dark mode" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div>
      <button class="dicon" id="bell" aria-label="Notifications" aria-expanded="false"><i data-lucide="bell"></i><span class="dot"></span></button>
      <div class="dme"><span class="av" id="meAv"></span><span><b id="meName"></b><small id="meOrg"></small></span></div>
    </header>
    <div class="dbanner"><i data-lucide="info"></i>Preview dashboard with sample data. Everything is clickable; changes are kept only in this browser.</div>
    <main class="dcontent" id="dash" tabindex="-1"></main>
  </div>
</div>
<script src="assets/seaport/seaport.js"></script>
<script src="assets/seaport/dashboard.js"></script>
</body>
</html>
